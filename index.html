<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey Form – 6 lig</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:16px}
h1{font-size:1.35rem;font-weight:700;margin-bottom:4px}
.sub{color:#94a3b8;font-size:.85rem;margin-bottom:18px}
section{background:#1e293b;border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid #334155}
.sec-title{font-size:1rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title .badge{font-size:.7rem;padding:2px 8px;border-radius:999px;font-weight:600}
.badge-today{background:#0369a1;color:#fff}
.badge-yest{background:#0f766e;color:#fff}
.badge-form{background:#1d4ed8;color:#fff}
.empty-box{border:1px dashed #475569;border-radius:10px;padding:22px;text-align:center;color:#94a3b8;cursor:pointer;transition:.15s}
.empty-box:hover{border-color:#38bdf8;color:#e2e8f0;background:#0f172a}
.empty-box strong{display:block;font-size:1rem;color:#f1f5f9;margin-bottom:4px}
.match-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.match-card{background:#0f172a;border-radius:8px;padding:8px 10px;border:1px solid #334155;display:flex;flex-direction:column;gap:4px}
.match-card .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.match-card .team{display:flex;align-items:center;gap:6px;font-size:.78rem;line-height:1.2;min-width:0}
.match-card .team.home{justify-content:flex-end;text-align:right}
.match-card .team.away{justify-content:flex-start;text-align:left}
.match-card .team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-card .team img,.match-card .team .fallback{width:22px;height:22px;flex-shrink:0;object-fit:contain;border-radius:3px}
.match-card .score{font-weight:700;font-size:1rem;text-align:center;min-width:42px;color:#f1f5f9}
.match-card .meta{font-size:.68rem;color:#64748b;text-align:center}
.badge{font-size:.6rem;padding:1px 5px;border-radius:4px;font-weight:600}
.badge.done{background:#065f46;color:#6ee7b7}
.badge.wait{background:#1e3a5f;color:#7dd3fc}
.league{margin-bottom:14px}
.league-title{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px;font-size:.9rem}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:56px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:.12s}
.tile:hover,.tile.active{border-color:#38bdf8;background:#1e293b}
.tile img,.tile .fallback{width:32px;height:32px;object-fit:contain;margin:0 auto;display:block;border-radius:3px}
.fallback{display:flex;align-items:center;justify-content:center;background:#334155;color:#94a3b8;font-size:.65rem;font-weight:700}
.tile .cnt{font-size:.58rem;color:#64748b;margin-top:2px}
.detail{margin-top:12px;background:#0f172a;border-radius:10px;padding:12px;border:1px solid #334155}
.detail h3{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.detail table{width:100%;border-collapse:collapse;font-size:.85rem}
.detail th{text-align:left;color:#94a3b8;font-weight:500;padding:4px 6px;border-bottom:1px solid #334155}
.detail td{padding:5px 6px;border-bottom:1px solid #1e293b}
.detail td.w{color:#4ade80;font-weight:600}
.detail td.l{color:#f87171;font-weight:600}
.detail td.g{color:#38bdf8;font-weight:600}
.detail td.empty{color:#64748b;text-align:center}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:#1d4ed8;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;cursor:pointer;font-weight:500}
.btn:hover{background:#2563eb}
.btn.secondary{background:#334155}
.btn.secondary:hover{background:#475569}
.btn.danger{background:#7f1d1d}
#status{font-size:.8rem;color:#94a3b8;margin-bottom:10px;min-height:1.2em}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#1e293b;border-radius:14px;width:min(640px,100%);max-height:90vh;overflow:auto;border:1px solid #475569;padding:18px}
.modal h2{font-size:1.1rem;margin-bottom:8px}
.modal p{font-size:.85rem;color:#94a3b8;margin-bottom:12px}
#pasteArea{width:100%;min-height:180px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#e2e8f0;padding:10px;font-family:ui-monospace,monospace;font-size:.8rem;resize:vertical}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#parseLog{margin-top:12px;font-size:.8rem;color:#94a3b8;max-height:160px;overflow:auto}
#parseLog b{color:#e2e8f0}
img{max-width:100%}
</style>
</head>

<h1>Hockey Form – 6 lig</h1>
<p class="sub">Mecze dziś · wczoraj · forma drużyn. Wklej wyniki Flashscore przez „dodaj”.</p>
<div id="status"></div>

<!-- MECZE DZIŚ -->
<section id="sec-today">
  <div class="sec-title"><span class="badge badge-today">DZIŚ</span> Mecze dziś</div>
  <div id="todayBox"></div>
</section>

<!-- MECZE WCZORAJ -->
<section id="sec-yest">

  <div id="yestBox"></div>
</section>

<!-- FORMA -->
<section id="sec-form">
  <div class="sec-title"><span class="badge badge-form">FORMA</span> Forma drużyn</div>
  <div class="toolbar">
    <button class="btn secondary" onclick="openPasteModal()">Wklej wyniki</button>
    <button class="btn secondary" onclick="forceSeed()">Przeładuj seed</button>
    <button class="btn secondary" onclick="collapseAll()">Zwiń wszystko</button>
  </div>
  <div id="root"></div>
</section>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closePasteModal()">
  <div class="modal">
    <h2>Wklej wyniki Flashscore</h2>
    <p>Wklej blok z wynikami (Koniec / Po dogrywce / Po rzutach) albo listę meczów „dziś”. Parser dopisze do formy i list.</p>
    <textarea id="pasteArea" placeholder="Extraliga&#10;CZECHY:&#10;Tabela&#10;Koniec&#10;Sparta Praga&#10;Vitkovice&#10;30&#10;..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="runParse()">Przetwórz</button>
      <button class="btn secondary" onclick="document.getElementById('pasteArea').value=''">Wyczyść</button>
      <button class="btn secondary" onclick="closePasteModal()">Zamknij</button>
    </div>
    <div id="parseLog"></div>
  </div>
</div>

    .replace(/^Frankfurt$/,"Frankfurt")
    .replace(/^Berlin$/,"Berlin")
    .replace(/^München$/,"München")
    .replace(/^Mannheim$/,"Mannheim")
    .replace(/^Nowy Targ$/,"Podhale")
    .replace(/^Jastrzębie$/,"JKH")
    .replace(/^Sosnowiec$/,"Zagłębie")
    .replace(/^Bratislava$/,"Slovan")
    .replace(/^Bystrica$/,"B. Bystrica")
    .replace(/^Mikuláš$/,"L. Mikuláš")
    .replace(/^Nová Ves$/,"S.N. Ves")
    .replace(/^Michalovce$/,"Michalovce")
    .replace(/^Trenčín$/,"Trenčín")
    .replace(/^Žilina$/,"Žilina");
}

function renderToday(){
  const el = document.getElementById("todayBox");
  if (!todayMatches.length){
    el.innerHTML = `<div class="empty-box" onclick="openPasteModal()"><strong>Brak wyników → kliknij aby dodać</strong>Wklej listę meczów z Flashscore (dziś)</div>`;
    return;
  }
  el.innerHTML = `<div class="match-list">` + todayMatches.map(m => `
    <div class="match-card">
      <div class="row">
        <div class="team home"><span>${shortName(m.home)}</span>${logoHtml(m.home,22)}</div>
        <div class="score">–</div>
        <div class="team away">${logoHtml(m.away,22)}<span>${shortName(m.away)}</span></div>
      </div>
      <div class="meta"><span class="badge wait">dziś</span> ${m.league||""}</div>
    </div>`).join("") + `</div>`;
}

function renderYest(){
  const el = document.getElementById("yestBox");
  if (!yestMatches.length){
    el.innerHTML = `<div class="empty-box" onclick="openPasteModal()"><strong>Brak wyników → kliknij aby dodać</strong>Wklej zakończone mecze z Flashscore</div>`;
    return;
  }
  el.innerHTML = `<div class="match-list">` + yestMatches.map(m => `
    <div class="match-card">
      <div class="row">
        <div class="team home"><span>${shortName(m.home)}</span>${logoHtml(m.home,22)}</div>
        <div class="score">${m.hg}:${m.ag}</div>
        <div class="team away">${logoHtml(m.away,22)}<span>${shortName(m.away)}</span></div>
      </div>
      <div class="meta"><span class="badge done">${m.status||"koniec"}</span> ${m.league||""}</div>
    </div>`).join("") + `</div>`;
}

function renderForm(){
  const root = document.getElementById("root");
  root.innerHTML = "";
  const byL = {};
  Object.entries(TEAMS).forEach(([t,l]) => { if (!byL[l]) byL[l] = []; byL[l].push(t); });
  ["Czechy","Finlandia","Niemcy","Szwecja","Polska","Słowacja"].forEach(league => {
    if (!byL[league]) return;
    const sec = document.createElement("div");
    sec.className = "league";
    sec.innerHTML = `<div class="league-title"><span class="dot" style="background:${COLORS[league]||'#64748b'}"></span>${league}</div>`;
    const tiles = document.createElement("div");
    tiles.className = "tiles";
    byL[league].forEach(team => {
      const n = (DB[team]||[]).length;
      const tile = document.createElement("div");
      tile.className = "tile" + (openTeam === team ? " active" : "");
      tile.title = team;
      tile.onclick = () => toggle(team);
      tile.innerHTML = logoHtml(team, 32) + `<div class="cnt">${n} mecz.</div>`;
      tiles.appendChild(tile);
    });
    sec.appendChild(tiles);
    if (openTeam && TEAMS[openTeam] === league) {
      const det = document.createElement("div");
      det.className = "detail";
      const matches = DB[openTeam] || [];
      let rows = matches.map(m => {
        const cls = m.gf > m.ga ? "w" : (m.gf < m.ga ? "l" : "");
        return `<tr><td>${m.date}</td><td>${m.opp}</td><td class="${cls}">${m.res}</td><td class="g">${m.gf}</td></tr>`;
      }).join("");
      if (!rows) rows = `<tr><td colspan="4" class="empty">brak danych formy</td></tr>`;
      det.innerHTML = `<h3>${logoHtml(openTeam,24)} ${openTeam}</h3>
        <table><thead><tr><th>Data</th><th>Przeciwnik</th><th>Wynik</th><th>Gole</th></tr></thead><tbody>${rows}</tbody></table>`;
      sec.appendChild(det);
    }
    root.appendChild(sec);
  });
}

function renderAll(){ renderToday(); renderYest(); renderForm(); }

function resolveName(raw){
  if (!raw) return null;
  const t = raw.trim();
  if (TEAMS[t]) return t;
  if (ALIASES[t]) return ALIASES[t];
  for (const [a, full] of Object.entries(ALIASES)) {
    if (t.toLowerCase() === a.toLowerCase()) return full;
  }
  for (const name of Object.keys(TEAMS)) {
    if (name.toLowerCase().includes(t.toLowerCase()) || t.toLowerCase().includes(name.toLowerCase().split(" ").pop()))
      return name;
  }
  return null;
}

function readScoreAt(lines, i){
  const a = lines[i], b = lines[i+1];
  if (a && /^\d{2,3}$/.test(a)) {
    const s = a;
    if (s.length === 2) return [parseInt(s[0],10), parseInt(s[1],10), i+1];
    const twoOne = [parseInt(s.slice(0,2),10), parseInt(s.slice(2),10)];
    const oneTwo = [parseInt(s[0],10), parseInt(s.slice(1),10)];
    if (s[0] === "1" && twoOne[0] >= 10) return [twoOne[0], twoOne[1], i+1];
    return [oneTwo[0], oneTwo[1], i+1];
  }
  if (a && b && /^\d{1,2}$/.test(a) && /^\d{1,2}$/.test(b)) {
    return [parseInt(a,10), parseInt(b,10), i+2];
  }
  return null;
}

function isFinishedStatus(line){
  const l = line.trim().toLowerCase();
  return l === "koniec" || l === "po dogrywce" || l === "po rzutach karnych" || l === "po rzutach"
    || l.startsWith("po dogrywce") || l.startsWith("po rzutach");
}

function leagueFromHeader(line){
  const u = line.toUpperCase();
  if (u.includes("EXTRALIGA") && !u.includes("SŁOW") && !u.includes("SLOW")) return "Czechy";
  if (u.includes("CZECH")) return "Czechy";
  if (u.includes("LIIGA") || u.includes("FINLAND")) return "Finlandia";
  if (u.includes("DEL") || u.includes("NIEMC")) return "Niemcy";
  if (u.includes("SHL") || u.includes("SZWEC")) return "Szwecja";
  if (u.includes("TAURON") || u.includes("POLSK") || u.includes("PHL")) return "Polska";
  if (u.includes("TIPSPORT") || u.includes("SŁOWAC") || u.includes("SLOWAC")) return "Słowacja";
  return null;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function yestStr(){
  const d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function addForm(team, opp, gf, ga, date){
  if (!DB[team]) DB[team] = [];
  const res = gf + ":" + ga;
  if (DB[team].some(m => m.date === date && m.opp === opp)) return false;
  DB[team].unshift({ date, opp, res, gf, ga });
  if (DB[team].length > 8) DB[team] = DB[team].slice(0, 8);
  return true;
}

function runParse(){
  const text = document.getElementById("pasteArea").value || "";
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  const finished = [];
  const pending = [];
  let curLeague = null;
  let i = 0;
  const log = [];

  while (i < lines.length) {
    const line = lines[i];
    const lg = leagueFromHeader(line);
    if (lg) { curLeague = lg; i++; continue; }
    if (/^(CZECHY|FINLANDIA|NIEMCY|SZWECJA|POLSKA|SŁOWACJA|SLOWACJA|Tabela|TABLE)/i.test(line)) { i++; continue; }
    if (/ICE Hockey|AUSTRIA|KHL|VHL|NHL|Metal Ligaen|OHL|WHL/i.test(line)) {
      curLeague = "SKIP"; i++; continue;
    }

    if (isFinishedStatus(line)) {
      const status = line;
      let home = lines[i+1], away = lines[i+2];
      if (!home || !away) { i++; continue; }
      if (isFinishedStatus(home) || leagueFromHeader(home)) { i++; continue; }

      const scPack = readScoreAt(lines, i+3);
      let hg, ag, nextI;
      if (scPack) {
        [hg, ag, nextI] = scPack;
      } else {
        log.push("brak wyniku: " + home + " – " + away + " (raw=" + (lines[i+3]||"?") + ")");
        i += 3;
        while (i < lines.length && /^\d+$/.test(lines[i]) && lines[i].length <= 2) i++;
        continue;
      }

      const homeN = resolveName(home);
      const awayN = resolveName(away);
      i = nextI;
      while (i < lines.length && /^\d+$/.test(lines[i]) && lines[i].length <= 2) i++;

      if (curLeague === "SKIP") {
        log.push("skip liga: " + home + " – " + away);
        continue;
      }
      const inDb = (homeN && TEAMS[homeN]) || (awayN && TEAMS[awayN]);
      if (!inDb) {
        log.push("poza 6 ligami: " + home + " – " + away);
        continue;
      }
      const date = yestStr();
      if (homeN && TEAMS[homeN]) addForm(homeN, awayN || away, hg, ag, date);
      if (awayN && TEAMS[awayN]) addForm(awayN, homeN || home, ag, hg, date);
      finished.push({ home: homeN||home, away: awayN||away, hg, ag, status, league: curLeague || "?" });
      continue;
    }

    // pending: look for two consecutive team-like names (no status)
    // simple: if resolveName works for two consecutive lines and next is -- or time
    const hN = resolveName(line);
    const aN = resolveName(lines[i+1] || "");
    if (hN && aN && TEAMS[hN] && TEAMS[aN]) {
      pending.push({ home: hN, away: aN, league: curLeague || TEAMS[hN] });
      i += 2;
      // skip trailing -- or digits
      while (i < lines.length && (lines[i] === "--" || /^\d{1,2}:\d{2}$/.test(lines[i]) || lines[i] === "-")) i++;
      continue;
    }
    i++;
  }

  yestMatches = finished.concat(yestMatches).slice(0, 80);
  // dedupe today
  const seenT = new Set(todayMatches.map(m => m.home+"|"+m.away));
  pending.forEach(m => {
    const k = m.home+"|"+m.away;
    if (!seenT.has(k)) { todayMatches.push(m); seenT.add(k); }
  });
  todayMatches = todayMatches.slice(0, 40);

  const logEl = document.getElementById("parseLog");
  logEl.innerHTML = `<b>Zakończone:</b> ${finished.length} · <b>Dziś:</b> ${pending.length}<br>` +
    finished.map(m => `${m.home} ${m.hg}:${m.ag} ${m.away}`).join("<br>") +
    (pending.length ? "<br><br><b>Zaplanowane:</b><br>" + pending.map(m => `${m.home} – ${m.away}`).join("<br>") : "") +
    (log.length ? "<br><br><b>Uwagi:</b><br>" + log.slice(0,25).join("<br>") : "");

  setStatus(`Dopisano ${finished.length} zakończonych, ${pending.length} na dziś.`);
  renderAll();
  // keep modal open so user sees log; or close after short delay
}

renderAll();
setStatus("Seed załadowany · " + Object.keys(DB).filter(k => DB[k].length).length + " drużyn z formą.");
</script>
